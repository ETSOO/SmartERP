apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarterp-workercenter
  namespace: smarterp
  labels:
    app: smarterp-workercenter
spec:
  replicas: 1 # 后台任务服务保持 1 个副本，避免 Cron 任务重复触发
  selector:
    matchLabels:
      app: smarterp-workercenter
  template:
    metadata:
      labels:
        app: smarterp-workercenter
    spec:
      containers:
        - name: smarterp-workercenter
          image: smarterp/smarterp-workercenter:1.0.0
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
          envFrom:
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: workercenter-secrets
