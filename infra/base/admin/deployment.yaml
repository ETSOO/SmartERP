apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarterp-admin
  namespace: smarterp
  labels:
    app: smarterp-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smarterp-admin
  template:
    metadata:
      labels:
        app: smarterp-admin
    spec:
      containers:
        - name: smarterp-admin
          image: smarterp/smarterp-admin:1.0.0
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: admin-secrets
