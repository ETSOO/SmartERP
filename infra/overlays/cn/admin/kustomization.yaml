apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smarterp

resources:
  - ../../../base/shared
  - ../../../base/admin

images:
  - name: smarterp/smarterp-admin
    newName: etsoo-registry.cn-qingdao.cr.aliyuncs.com/smarterp/smarterp-admin

secretGenerator:
  # 生成应用配置环境变量
  - name: admin-secrets
    envs:
      - admin.env.secrets

patches:
  # 仅 CN 注入 imagePullSecrets
  - target:
      kind: Deployment
      name: smarterp-admin
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: aliyun-acr-secret
