apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smarterp

resources:
  - ../../../base/shared
  - ../../../base/coreapp

images:
  - name: smarterp/smarterp-coreapp
    newName: ghcr.io/etsoo/smarterp-coreapp

secretGenerator:
  # 生成应用配置环境变量
  - name: coreapp-secrets
    envs:
      - coreapp.env.secrets

patches:
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: smarterp-coreapp-route
    patch: |-
      - op: replace
        path: /spec/hostnames/0
        value: "coreapp.etsoo.nz"
