apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/platform

images:
  - name: smarterp/smarterp-platform
    newName: ghcr.io/etsoo/smarterp-platform

secretGenerator:
  # 生成应用配置环境变量
  - name: smarterp-prod-secrets
    envs:
      - /etc/smarterp/.env.secrets
