# MicroK8s Bootstrap Configuration
# Set up namespaces and secrets for various services before deploying them
__DISABLED_FILE_ERROR_RAISED__: Comment out the next line after the configuration is done

# pgAdmin Initialization

apiVersion: v1
kind: Namespace
metadata:
  name: pgadmin-system
---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: pgadmin-system
type: Opaque
stringData:
  pgadmin-email: "info@etsoo.com"
  pgadmin-password: "1"
---
