apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarterp-crm
  namespace: smarterp
  labels:
    app: smarterp-crm
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: smarterp-crm
  template:
    metadata:
      labels:
        app: smarterp-crm
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: smarterp-crm
          image: "{{ .Values.global.imageRegistry }}/smarterp-crm:{{ .Values.imageTag | default .Values.global.imageTag }}"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: DOTNET_ENVIRONMENT
              value: "{{ .Values.global.DOTNET_ENVIRONMENT }}"
            - name: TZ
              value: "{{ .Values.global.TZ }}"
          envFrom:
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: crm-secrets
          resources:
            requests:
              cpu: "10m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
