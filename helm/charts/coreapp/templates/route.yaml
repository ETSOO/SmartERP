apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smarterp-coreapp-route
  namespace: smarterp
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: ingress
  hostnames:
    - "coreapp.{{ .Values.global.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: smarterp-coreapp
          port: 8080
