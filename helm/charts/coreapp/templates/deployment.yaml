apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarterp-coreapp
  namespace: smarterp
  labels:
    app: smarterp-coreapp
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: smarterp-coreapp
  template:
    metadata:
      labels:
        app: smarterp-coreapp
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: smarterp-coreapp
          image: "{{ .Values.global.imageRegistry }}/smarterp-coreapp:{{ .Values.imageTag | default .Values.global.imageTag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: coreapp-secrets
