apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarterp-platform
  namespace: smarterp
  labels:
    app: smarterp-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smarterp-platform
  template:
    metadata:
      labels:
        app: smarterp-platform
    spec:
      {{- if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: smarterp-platform
          image: "{{ .Values.global.imageRegistry }}/smarterp-platform:{{ .Values.imageTag | default .Values.global.imageTag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DOTNET_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          envFrom:
            - secretRef:
                name: shared-secrets
            - secretRef:
                name: platform-secrets
