events {
}

http {
	# All certificates are created within LocalSetupDocker
	server {
		listen              80;
		listen              443 ssl;
		server_name         pgadmin.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://pgadmin.app.local:5501;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		server_name         rabbitmq.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://rabbitmq.app.local:15672;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		server_name         garnetui.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://garnetui.app.local:5540;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		server_name         minio.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_set_header   Upgrade $http_upgrade;
			proxy_set_header   Connection "upgrade";
			proxy_pass         http://minio.app.local:8901;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              [::]:80;
		listen              443 ssl;
		listen              [::]:443 ssl;
		server_name         minioapi.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		# Allow special characters in headers
		ignore_invalid_headers off;

		# Set to 0 to allow any size file to be uploaded.
		# Set to a value such as 1000m; to restrict file size to a specific value
		client_max_body_size 500m;

		# Disable buffering
		proxy_buffering off;
		proxy_request_buffering off;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Real-IP $remote_addr;
			proxy_set_header   Host $host;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass         http://minio.app.local:8900;

			proxy_connect_timeout 300;

			# Default is HTTP/1, keepalive is only enabled in HTTP/1.1
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			chunked_transfer_encoding off;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		server_name         seq.app.local;
		ssl_certificate     ssl/cert.pem;
		ssl_certificate_key ssl/key.pem;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://seq.app.local:80;
			proxy_buffering    on;
		}
	}
}