events {
}

http {
    # Define a shared memory zone called 'ipfilter' with a 10MB storage and maximum 10 requests per second
    limit_req_zone $binary_remote_addr zone=ipfilter:10m rate=100r/s;

	# Apply the limit
	limit_req zone=ipfilter burst=100;

	# All certificates are created within LocalSetupDocker
	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         pgadmin.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://pgadmin.app.local:5501;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         rabbitmq.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://rabbitmq.app.local:15672;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         garnetui.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://garnetui.app.local:5540;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         minio.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_set_header   Upgrade $http_upgrade;
			proxy_set_header   Connection "upgrade";
			proxy_pass         http://minio.app.local:8901;
			proxy_buffering    on;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         minioapi.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		# Allow special characters in headers
		ignore_invalid_headers off;

		# Set to 0 to allow any size file to be uploaded.
		# Set to a value such as 1000m; to restrict file size to a specific value
		client_max_body_size 500m;

		# Disable buffering
		proxy_buffering off;
		proxy_request_buffering off;

		location / {
			proxy_set_header   X-Real-IP $remote_addr;
			proxy_set_header   Host $host;
			proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
			proxy_pass         http://minio.app.local:8900;

			proxy_connect_timeout 300;

			# Default is HTTP/1, keepalive is only enabled in HTTP/1.1
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			chunked_transfer_encoding off;
		}
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         log.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location / {
			# Define the proxy pass to the pgAdmin container, the port is the internal port of the container
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         http://log.app.local:5080;
			proxy_buffering    on;
		}
	}

	client_header_buffer_size     128k;
	large_client_header_buffers   4 128k;
	proxy_buffer_size             256k;
	proxy_buffers                 4 256k;
	proxy_busy_buffers_size       256k;

	# Define the upstream for the platform-api
	# When debug with VS, the host.docker.internal is used to connect to the host machine
	# "9002" is for the front-end and vite.config.ts defines the proxy definition for "/api/"
	# When running the container, the platform.app.local is used to connect to the container
	# https://github.com/docker/for-mac/issues/7332
	upstream platform-site {
		server host.docker.internal:9002;
		server platform.app.local:8081 backup;
	}

	server {
		listen              80;
		listen              443 ssl;
		http2               on;
		server_name         platform.app.local;
		ssl_certificate     ssl/dev.pem;
		ssl_certificate_key ssl/dev.key;

		location /api/ {
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         https://platform-site/api/;
			proxy_buffering    on;
            limit_except       GET POST DELETE PUT OPTIONS {
               deny all;
            }
		}

		location / {
			proxy_set_header   X-Forwarded-For $remote_addr;
			proxy_set_header   Host $host;
			proxy_pass         https://platform-site;
			proxy_buffering    on;
		}
	}

