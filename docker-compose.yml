# Docker Compose file for SmartERP
# SmartERP 的 Docker Compose 文件

services:
    # Postgres database for SmartERP
    # name: 'etsoo', db: 'smarterp', user: 'smarterp'
    # 司友云ERP(SmartERP)的 Postgres 数据库
    postgres:
        image: postgres:16.3-alpine
        container_name: postgres.app.local
        restart: unless-stopped
        environment:
            POSTGRES_USER: smarterp
            POSTGRES_PASSWORD: smarterp
            POSTGRES_DB: smarterp
        ports:
            - "5432:5432"
        volumes:
            - ./data/postgres:/var/lib/postgresql/data

    # PgAdmin4 for Postgres management
    # 用于 Postgres 管理的 PgAdmin4
    pgadmin:
        depends_on:
            - postgres
        image: dpage/pgadmin4:latest
        container_name: pgadmin.app.local
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@etsoo.com
            PGADMIN_DEFAULT_PASSWORD: admin
            PGADMIN_LISTEN_PORT: 5501
        ports:
            - "5501:5501"
        volumes:
            - ./data/pgadmin:/var/lib/pgadmin

    # Etsoo Local setup
    # 亿速思维本地设置
    localsetup:
        image: localsetup
        tty: true # For infinite running
        # stdin_open: true
        build:
            context: .
            dockerfile: Resources/LocalSetupDocker
        container_name: localsetup
        volumes:
            - certs:/var/etsoo/certs

    # Distributed Cache (like Redis)
    garnet:
        image: 'ghcr.io/microsoft/garnet'
        container_name: garnet.app.local
        restart: unless-stopped
        ulimits:
          memlock: -1
        ports:
          - "6379:6379"
        # network_mode: "host"
        volumes:
          - garnetdata:/data

    # Redis Insight for Redis management
    redis-insight:
        depends_on:
            - garnet
        image: redis/redisinsight:latest
        container_name: garnetui.app.local
        restart: unless-stopped
        ports:
            - "5540:5540"

    # minio, API compatible with Amazon S3 cloud storage service
    # Create the folder instead of using the "MINIO_DEFAULT_BUCKETS" in standalone mode
    minio:
        image: minio/minio:latest
        container_name: minio.app.local
        restart: unless-stopped
        environment:
            - MINIO_ROOT_USER=admin
            - MINIO_ROOT_PASSWORD=password
            - MINIO_PROMETHEUS_AUTH_TYPE=public
            - MINIO_UPDATE=off
        entrypoint:
            - sh
            - -euc
            - |
                mkdir -p /data/smarterp && \
                minio server --address "0.0.0.0:8900" --console-address "0.0.0.0:8901" /data
        ports:
            - "8900:8900"
            - "8901:8901"
        volumes:
            - ./data/minio:/data

    # seq, port 80 for web, 5341 for API, 45341 for ingestion
    seq:
        image: datalust/seq:latest
        container_name: seq.app.local
        restart: unless-stopped
        environment:
            - ACCEPT_EULA=Y
        ports:
            - "5330:80"
            - "5331:5341"
            - "45341:45341"
        volumes:
            - ./data/seq:/data

    # Nginx for reverse proxy
    # Change the nginx.conf under root for your needs, make sure the ports (80, 443) are not used by other services (like IIS)
    # Nginx 用于反向代理
    # 修改根目录下的 nginx.conf 文件以适应你的需求，确保(80, 443)端口没有被其他服务占用（如 IIS）
    nginx:
        depends_on:
            - pgadmin
            - localsetup
            - redis-insight
            - minio
            - seq
        image: nginx:1.27-alpine
        container_name: nginx
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./Resources/nginx.conf:/etc/nginx/nginx.conf
            - ./data/nginx/logs:/etc/nginx/logs
            - ./data/nginx/cache:/var/cache/nginx
            - certs:/etc/nginx/ssl

# Volumes for persistance
volumes:
  certs:
    name: "dev-certs"
  garnetdata:
    name: "garnet-data"