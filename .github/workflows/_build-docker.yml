name: Build Docker

on:
  workflow_call:
    inputs:
      project_key:
        required: true
        type: string
        description: "Product key like admin, crm (项目标识)"
      version:
        required: true
        type: string
        description: "Docker image version to build (构建的镜像版本号)"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Mapping project key to docker file (映射项目标识到容器文件)
        id: config
        run: |
          case "${{ inputs.project_key }}" in
            platform)     echo "file=Platform/Platform.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            coreapp)      echo "file=CoreApp/CoreApp.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            admin)        echo "file=Admin/Admin.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            crm)          echo "file=CRM/CRM.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            workercenter) echo "file=WorkerCenter/Dockerfile" >> $GITHUB_OUTPUT ;;
            workercms)    echo "file=WorkerCMS/Dockerfile" >> $GITHUB_OUTPUT ;;
            *)
              echo "❌ Unknown project (未知项目): ${{ inputs.project_key }}"
              exit 1
              ;;
          esac

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GitHub Container Registry (GHCR) (登录GitHub GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun Container Registry (ACR) (登录阿里云 ACR)
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push (构建并推送 Docker 镜像)
        uses: docker/build-push-action@v7
        env:
          DCK: ${{ steps.config.outputs.file }}
          IMG: smarterp-${{ inputs.project_key }}
          VER: ${{ inputs.version }}
          ACR: ${{ vars.ACR_REGISTRY }}/smarterp
          GHCR: ghcr.io/etsoo
        with:
          context: .
          file: ${{ steps.config.outputs.file }}
          push: true
          tags: |
            ${{ env.GHCR }}/${{ env.IMG }}:${{ env.VER }}
            ${{ env.GHCR }}/${{ env.IMG }}:latest
            ${{ env.ACR }}/${{ env.IMG }}:${{ env.VER }}
            ${{ env.ACR }}/${{ env.IMG }}:latest
          cache-from: type=gha,scope=${{ env.IMG }}
          cache-to: type=gha,mode=max,scope=${{ env.IMG }}
