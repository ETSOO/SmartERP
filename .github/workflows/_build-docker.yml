name: Build Docker

on:
  workflow_call:
    inputs:
      projects:
        required: true
        type: string
        description: "Project keys (JSON array string)"
      version:
        required: true
        type: string
        description: "Docker image version to build"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        project: ${{ fromJson(inputs.projects) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Mapping project key to docker file (映射项目标识到容器文件)
        id: config
        run: |
          case "${{ matrix.project }}" in
            infra)
              echo "Skipping infra project build"
              exit 0
              ;;
            platform)     echo "file=Platform/Platform.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            coreapp)      echo "file=CoreApp/CoreApp.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            admin)        echo "file=Admin/Admin.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            crm)          echo "file=CRM/CRM.Server/Dockerfile" >> $GITHUB_OUTPUT ;;
            workercenter) echo "file=WorkerCenter/Dockerfile" >> $GITHUB_OUTPUT ;;
            workercms)    echo "file=WorkerCMS/Dockerfile" >> $GITHUB_OUTPUT ;;
            *)
              echo "❌ Unknown project (未知项目): ${{ matrix.project }}"
              exit 1
              ;;
          esac
