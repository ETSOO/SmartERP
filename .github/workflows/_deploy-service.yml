name: Deploy Service

on:
  workflow_call:
    inputs:
      region:
        required: true
        type: string
        description: "Target deployment region"
      version:
        required: true
        type: string
        description: "Image version to be deployed"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets[format('{0}_SSH_HOST', inputs.region)] }}
      SSH_PORT: ${{ secrets[format('{0}_SSH_PORT', inputs.region)] || '22' }}
      SSH_USER: ${{ secrets[format('{0}_SSH_USER', inputs.region)] }}
      SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', inputs.region)] }}
      RELEASE: "/home/smarterp/deploy/releases/${{ inputs.version }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "helm/*"
          target: "${{ env.RELEASE }}" # Update this to your target directory on the server
          rm: true # Set to true if you want to clear target folder before copying

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGION: ${{ inputs.region }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: 20m
          envs: REGION
          script: |
            # 遇到任何错误立即停止脚本执行
            set -e

            echo "Concatenate all secret files"
            SET_FILE_ARGS=()
            for file in /home/smarterp/secrets/*.env.secrets; do
              if [ -f "$file" ]; then
                # 自动提取文件名去掉扩展名作为 Values 键名，如 shared.env.secrets -> shared
                filename=$(basename "$file")
                app_key="${filename%%.*}" 

                # 将每个 secret 文件添加到 Helm 的 --set-file 参数中，名称为 secrets.<app_key>
                SET_FILE_ARGS+=(--set-file "secrets.${app_key}=${file}")
              fi
            done

            echo "Change directory to helm"
            cd "${{ env.RELEASE }}/helm"

            echo "Helm upgrade"
            microk8s helm3 upgrade smarterp . \
              --install \
              -n smarterp \
              --create-namespace \
              -f "./config/values-${REGION,,}.yaml" \
              "${SET_FILE_ARGS[@]}" \
              --atomic \
              --wait \
              --timeout 15m

            # Restart all SmartERP deployments to apply the new configuration
            echo "Restart"
            microk8s kubectl rollout restart deployment -n smarterp

  release:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TAG="release-${VERSION}"

          echo "=========================================="
          echo "🔍 Checking release: $TAG"
          echo "=========================================="

          if gh release view "$TAG" >/dev/null 2>&1; then

            gh release delete "$TAG" --yes --cleanup-tag
              
            echo "🗑️ Old release $TAG cleaned up."

          fi

          echo "Creating release $TAG"

          gh release create "$TAG" \
            --title "Release $VERSION" \
            --generate-notes
            
          echo "✅ Release $TAG created successfully!"
