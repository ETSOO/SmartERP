name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: smarterp-platform
            dockerfile: Platform/Platform.Server/Dockerfile

          - name: smarterp-workercenter
            dockerfile: WorkerCenter/Dockerfile

          - name: smarterp-workercms
            dockerfile: WorkerCMS/Dockerfile

          - name: smarterp-coreapp
            dockerfile: CoreApp/CoreApp.Server/Dockerfile

          - name: smarterp-admin
            dockerfile: Admin/Admin.Server/Dockerfile

          - name: smarterp-crm
            dockerfile: CRM/CRM.Server/Dockerfile

    steps:
      - name: Show build info
        run: |
          echo "Build version: ${{ inputs.version }}"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Login to Aliyun Container Registry (ACR)
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/etsoo/${{ matrix.name }}:${{ inputs.version }}
            ghcr.io/etsoo/${{ matrix.name }}:latest
            ${{ vars.ACR_REGISTRY }}/smarterp/${{ matrix.name }}:${{ inputs.version }}
            ${{ vars.ACR_REGISTRY }}/smarterp/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release if not exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |

          VERSION=${{ inputs.version }}

          TAG="release-${VERSION}"

          echo "Checking release: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release $TAG already exists, skip"

          else

            echo "Creating release $TAG"

            gh release create "$TAG" \
              --title "Release $VERSION" \
              --generate-notes

          fi
